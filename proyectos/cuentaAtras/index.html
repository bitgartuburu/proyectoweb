<!doctype html5>
<html>
<head>
    <meta charset="utf-8">
    <title>Cuenta Atrás</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js"></script>
</head>
<body onload="actualizarPantalla()">

    <div id="numeros">
        <span id="cuenta"></span>
    </div>

    <!-- Con este  código se definen los botones -->
    <button onclick="iniciar()">Iniciar</button>
    <button onclick="pausar()">Pausar</button>
    <button onclick="continuar()">Continuar</button>
    <button onclick="resetear()">Reset</button>
    <br>
	<!-- Crea el boton para que el usuario pueda aplicar un temporizador propio -->
    <input type="number" id="tiempoUsuario" placeholder="Segundos">
    <button onclick="aplicarTiempo()">Aplicar tiempo</button>

</body>
</html>
